name: Build Android Release

on:
  push:
    # Only version tags. No paths-ignore: combined with a tag trigger it can
    # skip the build when the tagged commit only touches .md files, and the
    # release commit touches the changelog and README.
    tags:
      - 'v*'

# Nothing gets write access by default; only the release job below does.
permissions:
  contents: read

jobs:
  # Builds the APKs with no secrets at all: no keystore, no passwords, no
  # write token. Every third-party action is pinned by commit SHA (a moved tag
  # could otherwise run foreign code next to the signing key, as in the
  # tj-actions incident), and checkout doesn't leave the token in .git/config,
  # where Gradle and the plugins' build scripts could read it.
  build:
    # Pinned (not ubuntu-latest): byte-for-byte reproducibility (IzzyOnDroid /
    # F-Droid) depends on a stable runner image, and the Android SDK,
    # build-tools and NDK come from that image. Move up deliberately,
    # re-verifying RB, never by drift.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'zulu'
        # JDK 21 to match the F-Droid buildserver default → reproducible build
        # (classes.dex byte-identical between this release and the F-Droid rebuild).
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        # Exact version, never "stable": F-Droid and IzzyOnDroid rebuild with
        # the same one. Changing it means updating their recipes too.
        flutter-version: '3.47.9'
        channel: 'stable'

    - name: Get Dependencies
      run: flutter pub get

    # Reproducible Builds — strip the build-id embedded by the linker into
    # libdartjni.so (transitive `jni` dep, through path_provider_android).
    # Without this, every build produces a different .so and the APK fails
    # IzzyOnDroid RB verification. Reported by IzzySoft in Issue #6.
    - name: Patch jni for Reproducible Builds
      run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $HOME/.pub-cache/hosted/*/jni-*/src/CMakeLists.txt

    # No android/key.properties here, so build.gradle.kts builds unsigned.
    - name: Build split APKs (unsigned)
      run: flutter build apk --release --split-per-abi

    - name: Keep the unsigned APKs for the release job
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: unsigned-apks
        path: build/app/outputs/flutter-apk/app-*-release.apk
        if-no-files-found: error
        retention-days: 3

  # Signs and publishes. It runs no build scripts and no third-party action
  # besides artifact download: the signing key lives only here, in a temporary
  # file that is removed at the end.
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Get the unsigned APKs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: unsigned-apks
        path: unsigned

    - name: Sign
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        ALIAS_PASSWORD: ${{ secrets.ALIAS_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        umask 077
        ks="$RUNNER_TEMP/release.jks"
        trap 'rm -f "$ks"' EXIT
        printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$ks"
        mkdir -p signed
        # --alignment-preserved: by default apksigner realigns the entries it
        # copies, so the signed APK no longer contains the unsigned build byte
        # for byte. F-Droid and IzzyOnDroid verify reproducible builds by copying
        # this signature onto their own unsigned build (apksigcopier); with a
        # realigned APK that copy fails for every ABI (found on v4.3.4-rc.1).
        # No v1 (JAR) signature: minSdk is 24, v1 is never checked there, and
        # v4.3.3 (signed by Gradle) had none.
        for f in unsigned/app-*-release.apk; do
          out="signed/$(basename "$f")"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_PASSWORD --key-pass env:ALIAS_PASSWORD \
            --alignment-preserved true --v1-signing-enabled false \
            --v4-signing-enabled false --out "$out" "$f"
          "$bt/apksigner" verify --print-certs "$out" | grep -m1 'SHA-256 digest'
        done

    # Release body = the F-Droid changelog for this version, so notes live in
    # one place. Tags with a suffix (v4.4.0-beta.1) become pre-releases, which
    # GitHub doesn't mark as latest and IzzyOnDroid doesn't publish.
    - name: Create Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        code="$(sed -n -E 's/^version:\s*.+\+([0-9]+).*/\1/p' pubspec.yaml)"
        pre=()
        case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
        gh release create "$GITHUB_REF_NAME" signed/app-*-release.apk \
          --title "$GITHUB_REF_NAME" \
          --notes-file "metadata/en-US/changelogs/${code}.txt" \
          --verify-tag "${pre[@]}"
